name: Release & Sync Updater to Gitee

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PlainWiFi ${{ github.ref_name }}"
          releaseBody: "正在从 CHANGELOG.md 读取更新内容..."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Assemble updater.json
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")

          # 定位本次分发的 NSIS 安装包，签名严格取其同名 .sig。
          # 禁止通配 *.sig + First 1：bundle.targets 含 nsis 与 msi 时会命中 .msi.sig，
          # 清单 signature 与 url 指向的产物不配对，客户端下载完在验签阶段失败（v1.0.4/v1.0.5 事故）。
          $exe = Get-ChildItem -Path . -Recurse -Filter "PlainWiFi_${ver}_x64-setup.exe" |
            Where-Object { $_.FullName -like "*bundle*" } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::未能找到 NSIS 安装包 PlainWiFi_${ver}_x64-setup.exe！"
            exit 1
          }
          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            Write-Host "::error::未能找到与安装包配对的签名文件 $($exe.Name).sig！"
            exit 1
          }
          $signature = (Get-Content $sigPath -Raw).Trim()

          # 硬校验：签名 trusted comment 里的 file: 必须就是 url 指向的那个文件名，否则拒绝发布清单
          $sigText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($signature))
          $signedFile = ((($sigText -split "`n") | Where-Object { $_ -match "file:" } | Select-Object -First 1) -split "`t")[-1] -replace "file:", ""
          $signedFile = $signedFile.Trim()
          if ($signedFile -ne $exe.Name) {
            Write-Host "::error::签名对应 $signedFile 与 url 指向的 $($exe.Name) 不配对，拒绝发布升级清单！"
            exit 1
          }
          Write-Host "updater 分发产物：$($exe.Name)（$([math]::Round($exe.Length / 1MB, 2)) MB），签名对应文件：$signedFile"

          # 供后续 Gitee 上传步骤复用同一份产物，避免二次通配搜索取到不同文件
          "UPDATER_EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # 从 CHANGELOG.md 提取对应版本的更新内容
          $notes = ""
          if (Test-Path "CHANGELOG.md") {
            $changelog = Get-Content "CHANGELOG.md" -Raw -Encoding utf8
            $pattern = "(?s)##\s*\[?$([regex]::Escape($ver))\]?[^\n]*\n(.*?)(?=##\s*\[?\d|\z)"
            $match = [regex]::Match($changelog, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
            }
          }
          if (-not $notes) { $notes = "PlainWiFi $ver（CHANGELOG.md 中未找到对应版本记录）" }

          # Gitee 链接指向 Gitee Release 附件地址
          $manifest = [ordered]@{
            version   = $ver
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://gitee.com/ShiXiongZhiDao/PlainWiFi/releases/download/${{ github.ref_name }}/PlainWiFi_${ver}_x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content updater.json -Encoding utf8

          # GitHub 链接指向 GitHub Release 附件地址
          $manifest.platforms."windows-x86_64".url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PlainWiFi_${ver}_x64-setup.exe"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content updater-github.json -Encoding utf8

          "RELEASE_NOTES<<EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $notes | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Get-Content updater.json
          Get-Content updater-github.json

      - name: Update GitHub Release body with CHANGELOG
        shell: pwsh
        run: |
          $env:RELEASE_NOTES | Out-File release_notes.md -Encoding utf8
          gh release edit "${{ github.ref_name }}" --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Tag & Package to Gitee Release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag   = "${{ github.ref_name }}"
          $owner = "ShiXiongZhiDao"
          $repo  = "PlainWiFi"

          # 1. 复用 Assemble 步骤已解析、且签名已核对配对的那份安装包
          if (-not $env:UPDATER_EXE_PATH -or -not (Test-Path $env:UPDATER_EXE_PATH)) {
            Write-Host "::error::未能读取上一步解析的安装包路径 UPDATER_EXE_PATH，中止上传！"
            exit 1
          }
          $exe = Get-Item $env:UPDATER_EXE_PATH

          # 2. 推送 Tag 到 Gitee
          $giteeUrl = "https://oauth2:${env:GITEE_TOKEN}@gitee.com/$owner/$repo.git"
          git push $giteeUrl $tag -f

          # 3. 检查并创建 Gitee Release（补全 target_commitish 参数）
          $headers = @{ "User-Agent" = "PowerShell" }
          $releasesUrl = "https://gitee.com/api/v5/repos/$owner/$repo/releases?access_token=${env:GITEE_TOKEN}"
          $existingReleases = Invoke-RestMethod -Uri $releasesUrl -Method Get -Headers $headers
          $release = $existingReleases | Where-Object { $_.tag_name -eq $tag }

          if (-not $release) {
            $createReleaseUrl = "https://gitee.com/api/v5/repos/$owner/$repo/releases"
            $body = @{
              access_token     = $env:GITEE_TOKEN
              tag_name         = $tag
              name             = "PlainWiFi $tag"
              body             = $env:RELEASE_NOTES
              target_commitish = "${{ github.sha }}"
            }
            $release = Invoke-RestMethod -Uri $createReleaseUrl -Method Post -Body $body
          }

          # 4. 上传 .exe 文件到 Gitee Release 附件
          $uploadUrl = "https://gitee.com/api/v5/repos/$owner/$repo/releases/$($release.id)/attach_files"
          curl.exe -X POST $uploadUrl `
            -F "access_token=${env:GITEE_TOKEN}" `
            -F "file=@$($exe.FullName);filename=$($exe.Name)"

      - name: Sync updater.json to Gitee updates branch
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $gitee = "https://oauth2:${env:GITEE_TOKEN}@gitee.com/ShiXiongZhiDao/PlainWiFi.git"
          git clone --depth 1 $gitee gitee-sync
          cd gitee-sync
          git checkout --orphan updates
          git rm -r --cached . -q
          Copy-Item ../updater.json .
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater.json
          git commit -m "chore(updates): release ${{ github.ref_name }} manifest"
          git push -f $gitee updates:updates

      - name: Attach updater manifests to GitHub Release
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" updater.json updater-github.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync updater manifest to GitHub updates branch
        shell: pwsh
        run: |
          Copy-Item updater-github.json "$env:TEMP\updater-github.json" -Force
          git reset --hard
          git clean -fd
          git checkout --orphan updates-gh
          git rm -r --cached . -q
          Copy-Item "$env:TEMP\updater-github.json" updater.json -Force
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f updater.json
          git commit -m "chore(updates): ${{ github.ref_name }} manifest (GitHub urls)"
          git push -f origin updates-gh:updates
