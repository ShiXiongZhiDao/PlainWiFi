name: Release & Sync Updater to Gitee

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PlainWiFi ${{ github.ref_name }}"
          releaseBody: "正在从 CHANGELOG.md 读取更新内容..."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Assemble updater.json
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")

          # 递归搜索 bundle 目录下的 .sig 签名文件
          $sig = Get-ChildItem -Path . -Recurse -Filter "*.sig" | Where-Object { $_.FullName -like "*bundle*" } | Select-Object -First 1
          if (-not $sig) {
            Write-Host "::error::未能找到 .sig 签名文件！"
            exit 1
          }
          $signature = (Get-Content $sig.FullName -Raw).Trim()

          # 从 CHANGELOG.md 提取对应版本的更新内容
          $notes = ""
          if (Test-Path "CHANGELOG.md") {
            $changelog = Get-Content "CHANGELOG.md" -Raw -Encoding utf8
            $pattern = "(?s)##\s*\[?$([regex]::Escape($ver))\]?[^\n]*\n(.*?)(?=##\s*\[?\d|\z)"
            $match = [regex]::Match($changelog, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
            }
          }
          if (-not $notes) { $notes = "PlainWiFi $ver（CHANGELOG.md 中未找到对应版本记录）" }

          $manifest = [ordered]@{
            version   = $ver
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://gitee.com/ShiXiongZhiDao/PlainWiFi/raw/updates/PlainWiFi_${ver}_x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content updater.json -Encoding utf8

          $manifest.platforms."windows-x86_64".url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PlainWiFi_${ver}_x64-setup.exe"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content updater-github.json -Encoding utf8

          "RELEASE_NOTES<<EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $notes | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Get-Content updater.json
          Get-Content updater-github.json

      - name: Update GitHub Release body with CHANGELOG
        shell: pwsh
        run: |
          $env:RELEASE_NOTES | Out-File release_notes.md -Encoding utf8
          gh release edit "${{ github.ref_name }}" --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync updater package to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver   = "${{ github.ref_name }}".TrimStart("v")

          # 递归搜索 bundle 目录下的所有 .exe 文件（兼容连字符与下划线命名）
          $exe   = Get-ChildItem -Path . -Recurse -Filter "*.exe" | Where-Object { $_.FullName -like "*bundle*" } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::未能找到安装包文件！"
            exit 1
          }

          $gitee = "https://oauth2:${env:GITEE_TOKEN}@gitee.com/ShiXiongZhiDao/PlainWiFi.git"
          git clone --depth 1 $gitee gitee-sync
          cd gitee-sync
          git checkout --orphan updates
          git rm -r --cached . -q
          Copy-Item $exe.FullName "PlainWiFi_${ver}_x64-setup.exe"
          Copy-Item ../updater.json .
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PlainWiFi_${ver}_x64-setup.exe updater.json
          git commit -m "chore(updates): release ${{ github.ref_name }} updater package"
          git push -f $gitee updates:updates

      - name: Attach updater manifests to GitHub Release
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" updater.json updater-github.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync updater manifest to GitHub updates branch
        shell: pwsh
        run: |
          git reset --hard
          git clean -fd
          git checkout --orphan updates-gh
          git rm -r --cached . -q
          Copy-Item updater-github.json updater.json -Force
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f updater.json
          git commit -m "chore(updates): ${{ github.ref_name }} manifest (GitHub urls)"
          git push -f origin updates-gh:updates
