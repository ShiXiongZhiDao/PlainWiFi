<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-c" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-p" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-y" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 纯黑背景 -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- RGB分离故障外框 -->
  <g style="mix-blend-mode:screen">
    <rect x="56" y="60" width="888" height="888" fill="none" stroke="#FF0040" stroke-width="5" filter="url(#glow-p)"/>
    <rect x="60" y="56" width="888" height="888" fill="none" stroke="#00FF41" stroke-width="5" filter="url(#glow-g)"/>
    <rect x="64" y="60" width="888" height="888" fill="none" stroke="#00BFFF" stroke-width="5" filter="url(#glow-c)"/>
  </g>
  <rect x="72" y="72" width="880" height="880" fill="none" stroke="#00FFFF" stroke-width="2" opacity="0.4"/>

  <!-- ========== 故障几何全家桶（全图随机分散，WiFi在最顶层不被遮挡） ========== -->

  <!-- 1. 大三角（绿色）左上 -->
  <g transform="translate(155,118) rotate(-7) scale(1.1)">
    <polygon points="0,-28 -24,22 24,22" fill="#FF0040" opacity="0.6" transform="translate(-3,1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-28 -24,22 24,22" fill="#00BFFF" opacity="0.6" transform="translate(3,-1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-28 -24,22 24,22" fill="#00FF41" stroke="#000" stroke-width="3"/>
    <line x1="-16" y1="-2" x2="16" y2="1" stroke="#000" stroke-width="2"/>
  </g>

  <!-- 2. 大方块（黄色）右上 -->
  <g transform="translate(830,105) rotate(5) scale(1.1)">
    <rect x="-22" y="-20" width="44" height="44" fill="#FF0040" opacity="0.6" transform="translate(-3,0)" style="mix-blend-mode:screen"/>
    <rect x="-18" y="-24" width="44" height="44" fill="#00BFFF" opacity="0.6" transform="translate(3,0)" style="mix-blend-mode:screen"/>
    <rect x="-20" y="-22" width="44" height="44" fill="#FFFF00" stroke="#000" stroke-width="3"/>
    <rect x="-20" y="-22" width="44" height="10" fill="#FFF" opacity="0.35"/>
    <rect x="10" y="-22" width="14" height="44" fill="#FF00FF" opacity="0.4"/>
  </g>

  <!-- 3. 中球（粉色）左侧偏上 -->
  <g transform="translate(105,345) scale(0.95)">
    <circle r="24" fill="#FF0040" opacity="0.6" transform="translate(-3,0)" style="mix-blend-mode:screen"/>
    <circle r="24" fill="#00BFFF" opacity="0.6" transform="translate(3,0)" style="mix-blend-mode:screen"/>
    <circle r="24" fill="#FF00FF" stroke="#000" stroke-width="3"/>
    <path d="M -24,0 A 24,24 0 0,1 24,0 L 24,-6 A 24,24 0 0,0 -24,-6 Z" fill="#00FFFF" opacity="0.45" transform="translate(4,-3)"/>
    <line x1="-24" y1="0" x2="24" y2="2" stroke="#000" stroke-width="2"/>
    <circle cx="-8" cy="-8" r="5" fill="#FFF" opacity="0.4"/>
  </g>

  <!-- 4. 中方块（青色）右侧偏上 -->
  <g transform="translate(905,375) rotate(-8) scale(0.9)">
    <rect x="-20" y="-18" width="40" height="40" fill="#FF0040" opacity="0.6" transform="translate(-2,1)" style="mix-blend-mode:screen"/>
    <rect x="-16" y="-22" width="40" height="40" fill="#00FF41" opacity="0.6" transform="translate(2,-1)" style="mix-blend-mode:screen"/>
    <rect x="-18" y="-20" width="40" height="40" fill="#00FFFF" stroke="#000" stroke-width="3"/>
    <line x1="-18" y1="-8" x2="22" y2="-5" stroke="#000" stroke-width="2"/>
    <line x1="-18" y1="8" x2="22" y2="11" stroke="#000" stroke-width="2"/>
  </g>

  <!-- 5. 小三角（黄色）中心上方偏左 -->
  <g transform="translate(295,265) rotate(10) scale(0.7)">
    <polygon points="0,-26 -22,20 22,20" fill="#00FF41" opacity="0.6" transform="translate(-2,-1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-26 -22,20 22,20" fill="#FF00FF" opacity="0.6" transform="translate(2,1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-26 -22,20 22,20" fill="#FFFF00" stroke="#000" stroke-width="3"/>
    <line x1="-14" y1="-2" x2="14" y2="0" stroke="#000" stroke-width="2"/>
  </g>

  <!-- 6. 小球（青色）中心上方偏右 -->
  <g transform="translate(710,275) scale(0.65)">
    <circle r="22" fill="#FF0040" opacity="0.6" transform="translate(-2,0)" style="mix-blend-mode:screen"/>
    <circle r="22" fill="#FFFF00" opacity="0.6" transform="translate(2,0)" style="mix-blend-mode:screen"/>
    <circle r="22" fill="#00FFFF" stroke="#000" stroke-width="3"/>
    <line x1="-22" y1="0" x2="22" y2="2" stroke="#000" stroke-width="2"/>
    <circle cx="-7" cy="-7" r="4" fill="#FFF" opacity="0.4"/>
  </g>

  <!-- 7. 迷你方块（粉色）中心正上方 -->
  <g transform="translate(445,185) scale(0.55)">
    <rect x="-14" y="-14" width="28" height="28" fill="#00FF41" opacity="0.6" transform="translate(-2,0)" style="mix-blend-mode:screen"/>
    <rect x="-12" y="-16" width="28" height="28" fill="#00BFFF" opacity="0.6" transform="translate(2,0)" style="mix-blend-mode:screen"/>
    <rect x="-13" y="-15" width="28" height="28" fill="#FF00FF" stroke="#000" stroke-width="3"/>
    <rect x="-13" y="-15" width="28" height="7" fill="#FFF" opacity="0.3"/>
  </g>

  <!-- 8. 迷你三角（绿色）中心正上方偏右 -->
  <g transform="translate(590,200) rotate(-6) scale(0.5)">
    <polygon points="0,-24 -20,18 20,18" fill="#FF0040" opacity="0.6" transform="translate(-1,1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-24 -20,18 20,18" fill="#FFFF00" opacity="0.6" transform="translate(1,-1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-24 -20,18 20,18" fill="#00FF41" stroke="#000" stroke-width="3"/>
  </g>

  <!-- 9. 中方块（黄色）左侧中间 -->
  <g transform="translate(118,545) rotate(6) scale(0.85)">
    <rect x="-20" y="-18" width="40" height="40" fill="#FF00FF" opacity="0.6" transform="translate(-2,1)" style="mix-blend-mode:screen"/>
    <rect x="-16" y="-22" width="40" height="40" fill="#00FFFF" opacity="0.6" transform="translate(2,-1)" style="mix-blend-mode:screen"/>
    <rect x="-18" y="-20" width="40" height="40" fill="#FFFF00" stroke="#000" stroke-width="3"/>
    <line x1="-18" y1="-6" x2="22" y2="-3" stroke="#000" stroke-width="2"/>
    <rect x="-18" y="-20" width="40" height="6" fill="#FFF" opacity="0.3"/>
  </g>

  <!-- 10. 中球（黄色）右侧中间 -->
  <g transform="translate(885,555) scale(0.8)">
    <circle r="23" fill="#FF0040" opacity="0.6" transform="translate(-2,1)" style="mix-blend-mode:screen"/>
    <circle r="23" fill="#00BFFF" opacity="0.6" transform="translate(2,-1)" style="mix-blend-mode:screen"/>
    <circle r="23" fill="#FFFF00" stroke="#000" stroke-width="3"/>
    <path d="M -23,0 A 23,23 0 0,0 23,0 L 23,6 A 23,23 0 0,1 -23,6 Z" fill="#FF00FF" opacity="0.4" transform="translate(-3,3)"/>
    <line x1="-23" y1="0" x2="23" y2="-2" stroke="#000" stroke-width="2"/>
    <circle cx="6" cy="6" r="4" fill="#FFF" opacity="0.45"/>
  </g>

  <!-- 11. 小倒三角（粉色）中心左下方 -->
  <g transform="translate(255,645) rotate(-9) scale(0.65)">
    <polygon points="0,24 -20,-18 20,-18" fill="#00FF41" opacity="0.6" transform="translate(-2,-1)" style="mix-blend-mode:screen"/>
    <polygon points="0,24 -20,-18 20,-18" fill="#00BFFF" opacity="0.6" transform="translate(2,1)" style="mix-blend-mode:screen"/>
    <polygon points="0,24 -20,-18 20,-18" fill="#FF00FF" stroke="#000" stroke-width="3"/>
    <line x1="-13" y1="0" x2="13" y2="2" stroke="#000" stroke-width="2"/>
  </g>

  <!-- 12. 小方块（青色）中心右下方 -->
  <g transform="translate(755,635) rotate(7) scale(0.6)">
    <rect x="-18" y="-16" width="36" height="36" fill="#FF0040" opacity="0.6" transform="translate(-2,1)" style="mix-blend-mode:screen"/>
    <rect x="-14" y="-20" width="36" height="36" fill="#FFFF00" opacity="0.6" transform="translate(2,-1)" style="mix-blend-mode:screen"/>
    <rect x="-16" y="-18" width="36" height="36" fill="#00FFFF" stroke="#000" stroke-width="3"/>
    <line x1="-16" y1="-6" x2="20" y2="-3" stroke="#000" stroke-width="2"/>
    <line x1="-16" y1="6" x2="20" y2="9" stroke="#000" stroke-width="2"/>
  </g>

  <!-- 13. 迷你球（青色）中心下方偏左 -->
  <g transform="translate(395,745) scale(0.48)">
    <circle r="22" fill="#FF0040" opacity="0.6" transform="translate(-2,0)" style="mix-blend-mode:screen"/>
    <circle r="22" fill="#00FF41" opacity="0.6" transform="translate(2,0)" style="mix-blend-mode:screen"/>
    <circle r="22" fill="#00FFFF" stroke="#000" stroke-width="3"/>
    <line x1="-22" y1="0" x2="22" y2="2" stroke="#000" stroke-width="2"/>
  </g>

  <!-- 14. 迷你三角（黄色）中心下方偏右 -->
  <g transform="translate(625,755) rotate(8) scale(0.45)">
    <polygon points="0,-24 -20,18 20,18" fill="#FF00FF" opacity="0.6" transform="translate(-1,1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-24 -20,18 20,18" fill="#00BFFF" opacity="0.6" transform="translate(1,-1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-24 -20,18 20,18" fill="#FFFF00" stroke="#000" stroke-width="3"/>
  </g>

  <!-- 15. 倒三角（粉色）左下 -->
  <g transform="translate(155,825) rotate(5) scale(0.9)">
    <polygon points="0,26 -22,-20 22,-20" fill="#00FF41" opacity="0.6" transform="translate(-2,-1)" style="mix-blend-mode:screen"/>
    <polygon points="0,26 -22,-20 22,-20" fill="#00BFFF" opacity="0.6" transform="translate(2,1)" style="mix-blend-mode:screen"/>
    <polygon points="0,26 -22,-20 22,-20" fill="#FF00FF" stroke="#000" stroke-width="3"/>
    <line x1="-14" y1="0" x2="14" y2="-2" stroke="#000" stroke-width="2"/>
    <polygon points="0,26 -22,-20 -7,-20" fill="#FFF" opacity="0.2"/>
  </g>

  <!-- 16. 球（黄色）右下 -->
  <g transform="translate(855,835) scale(0.85)">
    <circle r="23" fill="#FF0040" opacity="0.6" transform="translate(-2,1)" style="mix-blend-mode:screen"/>
    <circle r="23" fill="#00BFFF" opacity="0.6" transform="translate(2,-1)" style="mix-blend-mode:screen"/>
    <circle r="23" fill="#FFFF00" stroke="#000" stroke-width="3"/>
    <path d="M -23,0 A 23,23 0 0,0 23,0 L 23,6 A 23,23 0 0,1 -23,6 Z" fill="#FF00FF" opacity="0.4" transform="translate(-3,3)"/>
    <line x1="-23" y1="0" x2="23" y2="-2" stroke="#000" stroke-width="2"/>
    <circle cx="6" cy="6" r="4" fill="#FFF" opacity="0.45"/>
  </g>

  <!-- 17. 迷你方块（红色）底部中间 -->
  <g transform="translate(500,880) rotate(-4) scale(0.42)">
    <rect x="-14" y="-14" width="28" height="28" fill="#00FFFF" opacity="0.6" transform="translate(-2,0)" style="mix-blend-mode:screen"/>
    <rect x="-12" y="-16" width="28" height="28" fill="#00FF41" opacity="0.6" transform="translate(2,0)" style="mix-blend-mode:screen"/>
    <rect x="-13" y="-15" width="28" height="28" fill="#FF0040" stroke="#000" stroke-width="3"/>
  </g>

  <!-- 18. 迷你三角（青色）左侧偏下 -->
  <g transform="translate(200,695) rotate(11) scale(0.4)">
    <polygon points="0,-22 -19,17 19,17" fill="#FFFF00" opacity="0.6" transform="translate(-1,1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-22 -19,17 19,17" fill="#FF00FF" opacity="0.6" transform="translate(1,-1)" style="mix-blend-mode:screen"/>
    <polygon points="0,-22 -19,17 19,17" fill="#00FFFF" stroke="#000" stroke-width="3"/>
  </g>

  <!-- 19. 小方块散点群（底部偏左） -->
  <g transform="translate(340,925)">
    <rect x="0" y="0" width="12" height="12" fill="#FF0040" stroke="#000" stroke-width="2"/>
    <rect x="18" y="-3" width="9" height="9" fill="#00FFFF" stroke="#000" stroke-width="2"/>
    <rect x="33" y="2" width="11" height="11" fill="#FFFF00" stroke="#000" stroke-width="2"/>
    <rect x="51" y="-1" width="8" height="8" fill="#00FF41" stroke="#000" stroke-width="2"/>
  </g>

  <!-- 20. 小三角散点群（底部偏右） -->
  <g transform="translate(660,920)">
    <polygon points="0,0 -9,13 9,13" fill="#00FF41" stroke="#000" stroke-width="2"/>
    <polygon points="16,-5 7,9 25,9" fill="#FF00FF" stroke="#000" stroke-width="2"/>
    <polygon points="34,2 26,13 42,13" fill="#00BFFF" stroke="#000" stroke-width="2"/>
    <polygon points="50,-2 43,8 57,8" fill="#FFFF00" stroke="#000" stroke-width="2"/>
  </g>

  <!-- ========== WiFi + 黄方块（最顶层，放在最后确保不被遮挡） ========== -->

  <!-- 最外弧：荧光绿 -->
  <path d="M 234.88 435 A 320 320 0 0 1 789.12 435" fill="none" stroke="#000" stroke-width="72" stroke-linecap="butt"/>
  <path d="M 234.88 435 A 320 320 0 0 1 789.12 435" fill="none" stroke="#00FF41" stroke-width="52" stroke-linecap="butt" filter="url(#glow-g)"/>

  <!-- 中间弧：电光青 -->
  <path d="M 312.82 480 A 230 230 0 0 1 711.18 480" fill="none" stroke="#000" stroke-width="72" stroke-linecap="butt"/>
  <path d="M 312.82 480 A 230 230 0 0 1 711.18 480" fill="none" stroke="#00FFFF" stroke-width="52" stroke-linecap="butt" filter="url(#glow-c)"/>

  <!-- 最内弧：热粉 -->
  <path d="M 390.76 525 A 140 140 0 0 1 633.24 525" fill="none" stroke="#000" stroke-width="72" stroke-linecap="butt"/>
  <path d="M 390.76 525 A 140 140 0 0 1 633.24 525" fill="none" stroke="#FF00FF" stroke-width="52" stroke-linecap="butt" filter="url(#glow-p)"/>

  <!-- 底部黄色方块 -->
  <rect x="448" y="621" width="128" height="128" fill="#000"/>
  <rect x="452" y="625" width="120" height="120" fill="#FFFF00" filter="url(#glow-y)"/>
  <rect x="452" y="625" width="120" height="26" fill="#FFF" opacity="0.45"/>
</svg>
